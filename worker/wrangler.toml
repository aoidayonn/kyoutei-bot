name = "kyoutei-bot"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# 無料枠で動かす。Workers Free は 10万リクエスト/日まで。
workers_dev = true

[observability]
enabled = true

# 予想を残して後から的中率・回収率を検証するためのD1。
# `npx wrangler d1 create kyoutei` の出力にある database_id を貼る。
# これは識別子であって秘密情報ではないので、コミットして問題ない。
[[d1_databases]]
binding = "DB"
database_name = "kyoutei"
database_id = "4d876330-7ccb-4544-84b2-f61580a6ae4f"

# 秘密情報はこのファイルに書かない。.dev.vars に書いた値を
# 次のコマンドでまとめて登録する（手入力はタイプミスの元）:
#   npm run secrets
