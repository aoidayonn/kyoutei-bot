name: 週次モデル再学習

# 溜まったデータでモデルを学習し直し、**改善していれば自動でデプロイする**。
#
# 「人間がPRを見て判断する」を機械的な基準に置き換えている:
#   - 3連単NLL（商品指標）が0.002以上改善していること
#     （新旧とも同一窓で温度・段階指数を再推定した対称測定）
#   - 1着的中率が大きく落ちていないこと
#   - 1号艇を買い続けるより良いこと
# 満たさなければ何もせず、現行モデルのまま動き続ける。
#
# 事前に必要な設定:
#   Settings > Secrets and variables > Actions
#     Secrets:
#       CLOUDFLARE_API_TOKEN       Workers デプロイ用（未設定ならデプロイのみスキップ）
#       CLOUDFLARE_ACCOUNT_ID      同上
#       LINE_CHANNEL_ACCESS_TOKEN  結果通知用（任意）
#       LINE_USER_ID               同上
#   Settings > Actions > General > Workflow permissions
#     "Read and write permissions" を選択

on:
  schedule:
    # 毎週月曜 JST 6:00（UTC 日曜 21:00）
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      train_end:
        description: "学習に使う最終日 YYYY-MM-DD（省略時は3か月前）"
        required: false
      force:
        description: "改善していなくても採用する"
        type: boolean
        default: false

# 既定のシェルは `bash -e` で pipefail が無い。
# `cmd | tee log` と書くと tee の終了コードが採用され、
# cmd が失敗しても成功扱いになる（実際にこれで壊れたモデルがデプロイされた）。
# `shell: bash` を指定すると `bash --noprofile --norc -eo pipefail` になる。
defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: weekly-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ステップ内の env はそのステップの if から参照できないため、ジョブレベルに置く。
    # 未設定ならデプロイ手順だけスキップされ、学習とコミットは行われる。
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      - name: データベースを復元
        uses: actions/cache/restore@v4
        with:
          path: data/kyotei.db
          key: kyotei-db-
          restore-keys: kyotei-db-

      - name: データが足りているか確認
        run: |
          if [ ! -f data/kyotei.db ]; then
            echo "::error::data/kyotei.db がありません。先に「日次データ更新」を実行してください。"
            exit 1
          fi
          python - <<'EOF'
          import sqlite3
          con = sqlite3.connect("data/kyotei.db")
          n, = con.execute("select count(*) from races where trifecta is not null").fetchone()
          lo, hi = con.execute("select min(date), max(date) from races").fetchone()
          print(f"結果確定レース: {n:,} 件 ({lo} 〜 {hi})")
          assert n >= 10000, f"学習に足りません（{n} 件）"
          EOF

      # 審査は「審査用の双子」同士で行う（下の split コメント参照）。
      # 初回は双子が無いので、配備中の model.json を審査相手にする。
      - name: 現行の審査用モデルを退避
        run: |
          if [ -f pipeline/model_eval.json ]; then
            cp pipeline/model_eval.json /tmp/model-current.json
          else
            cp worker/src/model.json /tmp/model-current.json
          fi

      - name: 学習期間を決める（審査3ヶ月ラグ / 配備は昨日まで）
        id: split
        run: |
          # 「審査の正確さ」と「配備の新しさ」は検証窓の取り合いになる:
          #   検証1ヶ月 → 学習は新しいがノイズ±0.003で判定不能（実際に起きた）
          #   検証3ヶ月 → 判定は正確だが本番モデルが常に3ヶ月古い
          # そこで二段構えにする:
          #   審査用の双子: 3ヶ月前まで学習 → 13,000レースの窓で新旧レシピを審査
          #   配備用モデル: 同じレシピで昨日まで学習 → 審査済みなので再審査不要
          #     （同一レシピでデータを増やす・新しくするのは単調に得、が前提。
          #       壊れ方はテスト・パリティ・死活監視が受け止める）
          END="${{ github.event.inputs.train_end }}"
          [ -z "$END" ] && END=$(date -u -d '3 months ago' +%F)
          echo "train_end=$END" >> $GITHUB_OUTPUT
          echo "test_start=$(date -u -d "$END +1 day" +%F)" >> $GITHUB_OUTPUT
          DEPLOY_END=$(date -u -d 'yesterday' +%F)
          echo "deploy_end=$DEPLOY_END" >> $GITHUB_OUTPUT
          echo "deploy_start=$(date -u -d "$DEPLOY_END -36 months" +%F)" >> $GITHUB_OUTPUT
          # 学習は直近36ヶ月に限定する。実測した学習曲線は
          #   6ヶ月 3.873 / 1年 3.855 / 2年 3.851 / 3年 3.853（3連単NLL、2窓で確認）
          # で2年以降は平坦（±0.002のノイズ）。それ以上古いデータは
          # モーター入替や選手の変化で分布が乖離し、効かないか害になる。
          # 上限を切らないと学習ウィンドウが毎週伸び続け、メモリと時間だけ増える。
          echo "train_start=$(date -u -d "$END -36 months" +%F)" >> $GITHUB_OUTPUT

      # model.json に記録されている指標は、そのモデルを学習したときの検証期間で
      # 測ったもの。週次で再学習すると検証期間が毎回ずれるため、
      # そのまま比べるとモデルの差ではなく期間の差を見てしまう。
      # 同じ土俵に乗せるため、現行モデルを新しい検証期間で測り直す。
      - name: 現行モデルを新しい検証期間で測り直す
        working-directory: pipeline
        run: |
          python evaluate_model.py --model /tmp/model-current.json \
                                   --start ${{ steps.split.outputs.test_start }} \
                                   --out /tmp/current-metrics.json

      - name: 学習（審査用の双子）
        working-directory: pipeline
        run: |
          python train_gbm.py --train-start ${{ steps.split.outputs.train_start }} \
                              --train-end ${{ steps.split.outputs.train_end }} \
                              --out model_eval.json | tee ../train.log

      - name: バックテスト（審査用の双子を審査窓で）
        working-directory: pipeline
        run: python backtest.py --model model_eval.json --start ${{ steps.split.outputs.test_start }} | tee ../backtest.log

      # 新モデルも旧モデルと同じ手順（温度・段階指数を同一窓で再推定）で測る。
      # model.json 内の自己申告メトリクスを使うと、キャリブレーションの
      # 有無や当たり外れが比較に混ざる（実測で「改善0.036のうち0.025が温度」だった）
      - name: 新モデルを同じ検証期間で測る
        working-directory: pipeline
        run: |
          python evaluate_model.py --model model_eval.json \
                                   --start ${{ steps.split.outputs.test_start }} \
                                   --out /tmp/new-metrics.json

      # ここが「人間の判断」の代わり。
      # 改善していなければ以降のステップを全部飛ばす。
      - name: 現行モデルと比較して採用可否を決める
        id: compare
        working-directory: pipeline
        run: |
          # パイプ越しに終了コードを見ない。tee が成功を返して判定が壊れるため。
          set +e
          python compare_models.py /tmp/current-metrics.json /tmp/new-metrics.json > ../compare.log 2>&1
          RESULT=$?
          set -e
          cat ../compare.log

          if [ $RESULT -eq 0 ]; then
            echo "判定: 採用"
            echo "adopt=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "判定: 改善なしだが強制採用が指定されている"
            echo "adopt=true" >> $GITHUB_OUTPUT
            echo "forced=true" >> $GITHUB_OUTPUT
          else
            echo "判定: 見送り（現行モデルのまま）"
            echo "adopt=false" >> $GITHUB_OUTPUT
          fi

      # レシピが審査を通ったので、同じレシピで昨日まで学習した配備用を作る
      - name: 学習（配備用・昨日まで）
        if: steps.compare.outputs.adopt == 'true'
        working-directory: pipeline
        run: |
          python train_gbm.py --train-start ${{ steps.split.outputs.deploy_start }} \
                              --train-end ${{ steps.split.outputs.deploy_end }} \
                              --out ../worker/src/model.json | tee -a ../train.log

      - name: 特徴量フィクスチャの再生成
        if: steps.compare.outputs.adopt == 'true'
        working-directory: pipeline
        run: python export_fixture.py

      - uses: actions/setup-node@v4
        if: steps.compare.outputs.adopt == 'true'
        with:
          node-version: "22"

      # 特徴量の実装がPython側とTypeScript側でズレていないか。
      # ここが落ちたら絶対にデプロイしない（壊れたモデルが本番に出る）。
      - name: テスト
        if: steps.compare.outputs.adopt == 'true'
        working-directory: worker
        run: |
          npm ci || npm install
          npm test

      - name: 新しいモデルをコミット
        if: steps.compare.outputs.adopt == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/model.json worker/test/fixture.json pipeline/model_eval.json
          if git diff --cached --quiet; then
            echo "モデルに変化がありません"
          else
            git commit -m "chore: モデルを再学習（〜${{ steps.split.outputs.train_end }}）

          $(cat compare.log)"
            git push
          fi

      - name: Cloudflare へデプロイ
        if: steps.compare.outputs.adopt == 'true' && env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      - name: 結果をLINEに通知
        if: always()
        working-directory: pipeline
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          ADOPTED: ${{ steps.compare.outputs.adopt }}
          FORCED: ${{ steps.compare.outputs.forced }}
          JOB_STATUS: ${{ job.status }}
          HAS_CF_TOKEN: ${{ env.CF_TOKEN != '' }}
        run: |
          python - <<'EOF'
          import os
          from notify_line import notify

          status = os.environ.get("JOB_STATUS")
          adopted = os.environ.get("ADOPTED")
          deployed = os.environ.get("HAS_CF_TOKEN") == "true"

          def read(path):
              try:
                  return open(f"../{path}", encoding="utf-8").read().strip()
              except OSError:
                  return ""

          if status == "failure":
              body = "⚠️ 週次モデル再学習が失敗しました\n\n" + (read("train.log")[-500:] or "ログなし")
          elif adopted == "true":
              # CLOUDFLARE_API_TOKEN 未設定だとコミットまでで止まる。
              # その状態で「デプロイしました」と言うのは嘘になる
              head = ("✅ 新しいモデルをデプロイしました" if deployed
                      else "✅ 新しいモデルをコミットしました（CLOUDFLARE_API_TOKEN 未設定のためデプロイはスキップ。手動で npm run deploy してください）")
              if os.environ.get("FORCED") == "true":
                  # 下に貼る compare.log には「見送り」と書かれているので、
                  # force で採用した事実を明示しないと通知が自己矛盾して見える
                  head += "\n（force指定による強制採用。以下の比較結果は参考）"
              body = head + "\n\n" + read("compare.log")
              bt = read("backtest.log")
              if bt:
                  body += "\n\n" + bt[-800:]
          else:
              body = "― モデルを更新しませんでした（改善なし）\n\n" + read("compare.log")

          notify(body)
          EOF
