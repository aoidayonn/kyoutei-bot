name: 日次データ更新

# 前日のレース結果を取り込む。通常は1回2〜3分で終わる。
#
# 過去データをまとめて取り込む（バックフィル）にも使える。
# その場合は Run workflow から start / end を指定する。
# GitHubのランナーは海外にあり boatrace.jp への往復が遅いので、
# 1年分でおよそ15〜20分かかる。3年分を一度に流さず、
# 1年ずつ3回に分けて実行すること（取得済みファイルはスキップされるので、
# 途中で失敗しても同じ範囲を再実行すれば続きから進む）。
#
#   1回目: start=2023-07-01  end=2024-06-30
#   2回目: start=2024-07-01  end=2025-06-30
#   3回目: start=2025-07-01  end=(今日)
#
# 月末の日付に注意（4/6/9/11月は30日まで、2月は28か29日まで）。
# 存在しない日付を入れると「期間を決める」ステップで止まる。

# 既定のシェルは `bash -e` で pipefail が無い。
# `cmd | tee log` と書くと tee の終了コードが採用され、
# cmd が失敗しても成功扱いになる（実際にこれで壊れたモデルがデプロイされた）。
# `shell: bash` を指定すると `bash --noprofile --norc -eo pipefail` になる。
defaults:
  run:
    shell: bash

permissions:
  contents: read

on:
  schedule:
    # 毎日 JST 5:00（UTC 20:00）。前日の成績が確定している時間帯。
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "取得開始日 YYYY-MM-DD（省略時は前日）"
        required: false
      end:
        description: "取得終了日 YYYY-MM-DD"
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係のインストール
        run: pip install -r pipeline/requirements.txt

      - name: データベースを復元
        uses: actions/cache/restore@v4
        with:
          path: data/kyotei.db
          key: kyotei-db-
          restore-keys: kyotei-db-

      # DBはキャッシュにしか無く、7日間アクセスがないと消える。
      # 消えたことに気づかず走ると「前日1日分だけのDB」が出来上がり、
      # 週次学習が壊れたモデルを作ってしまう。ここで必ず気づけるようにする。
      - name: データベースの有無を確認
        id: check
        run: |
          if [ -f data/kyotei.db ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            python - <<'EOF'
          import sqlite3
          con = sqlite3.connect("data/kyotei.db")
          n, = con.execute("select count(*) from races").fetchone()
          lo, hi = con.execute("select min(date), max(date) from races").fetchone()
          print(f"復元: {n:,} レース ({lo} 〜 {hi})")
          EOF
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::データベースが見つかりません（キャッシュ失効の可能性）"
          fi

      - name: 期間を決める
        id: range
        run: |
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          [ -z "$START" ] && START=$(date -u -d "yesterday +9 hours" +%F)
          [ -z "$END" ] && END=$START

          # 存在しない日付（2025-06-31 など）はここで弾く。
          # そのまま流すと download.py が分かりにくいエラーで落ちる。
          for D in "$START" "$END"; do
            if ! date -d "$D" +%F > /dev/null 2>&1; then
              echo "::error::日付 $D は存在しません。月末の日数を確認してください（4/6/9/11月は30日、2月は28か29日）"
              exit 1
            fi
          done

          echo "start=$START" >> $GITHUB_OUTPUT
          echo "end=$END" >> $GITHUB_OUTPUT
          echo "期間: $START 〜 $END"

      - name: 番組表・競走成績のダウンロード
        working-directory: pipeline
        run: python download.py --start ${{ steps.range.outputs.start }} --end ${{ steps.range.outputs.end }} --workers 8

      - name: データベースへ取り込み
        working-directory: pipeline
        run: python build_db.py --start ${{ steps.range.outputs.start }} --end ${{ steps.range.outputs.end }} --jobs 2

      - name: 取り込み結果の確認
        run: |
          python - <<'EOF'
          import os
          import sqlite3
          con = sqlite3.connect("data/kyotei.db")
          n, = con.execute("select count(*) from races where trifecta is not null").fetchone()
          lo, hi = con.execute("select min(date), max(date) from races").fetchone()
          print(f"結果確定レース: {n:,} 件 ({lo} 〜 {hi})")
          assert n > 0, "レースが1件も入っていません"

          # 期間の両端だけ見ても途中の穴には気づけない。
          # 実際「2025-06-31」という存在しない日付で1回目が失敗し、
          # 1年分が抜けたまま2週間気づかなかった。
          # 通常は1か月あたり4,000〜5,200件なので、極端に少ない月を洗い出す。
          months = dict(con.execute(
              "select substr(date,1,7), count(*) from races"
              " where trifecta is not null group by 1 order by 1"
          ).fetchall())
          if months:
              keys = sorted(months)
              # 最初と最後の月は期間の切れ目で少なくなるので判定から外す
              gaps = [k for k in keys[1:-1] if months[k] < 3000]

              # 連続しているはずの月そのものが存在しないケースも拾う
              import datetime as _dt
              cur = _dt.date(int(keys[0][:4]), int(keys[0][5:]), 1)
              last = _dt.date(int(keys[-1][:4]), int(keys[-1][5:]), 1)
              missing = []
              while cur <= last:
                  k = cur.strftime("%Y-%m")
                  if k not in months:
                      missing.append(k)
                  cur = (cur.replace(day=28) + _dt.timedelta(days=4)).replace(day=1)

              print(f"収録月数: {len(keys)} ({keys[0]} 〜 {keys[-1]})")
              if missing:
                  print(f"::warning::欠落している月: {', '.join(missing)}")
              if gaps:
                  print(f"::warning::件数が極端に少ない月: {', '.join(f'{k}({months[k]}件)' for k in gaps)}")
              if missing or gaps:
                  print("::warning::その期間を start/end に指定して再実行すると埋まります")

          # 手動実行(バックフィル)以外で件数が極端に少ない場合は、
          # キャッシュが失効してDBが作り直されている。
          # このまま週次学習が走ると壊れたモデルができるので止める。
          manual = os.environ.get("MANUAL") == "true"
          if not manual and n < 5000:
              raise SystemExit(
                  f"レース数が {n:,} 件しかありません。キャッシュが失効した可能性があります。\n"
                  "Actions から手動でバックフィルし直してください:\n"
                  "  start=2023-07-01 end=2024-06-30\n"
                  "  start=2024-07-01 end=2025-06-30\n"
                  "  start=2025-07-01 end=(今日)"
              )
          EOF
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}

      # 週次学習ワークフローも同じキャッシュを読む
      - name: データベースを保存
        uses: actions/cache/save@v4
        with:
          path: data/kyotei.db
          key: kyotei-db-${{ github.run_id }}

      # キャッシュは7日で消えるが、アーティファクトは90日残る。
      # キャッシュが飛んだときはここからダウンロードして復旧できる。
      - name: バックアップを保存
        uses: actions/upload-artifact@v4
        with:
          name: kyotei-db-backup
          path: data/kyotei.db
          retention-days: 90
          overwrite: true
