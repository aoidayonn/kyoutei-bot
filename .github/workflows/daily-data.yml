name: 日次データ更新

# 前日のレース結果を取り込む。通常は1回2〜3分で終わる。
#
# 過去データをまとめて取り込む（バックフィル）にも使える。
# その場合は Run workflow から start / end を指定する。
# GitHubのランナーは海外にあり boatrace.jp への往復が遅いので、
# 1年分でおよそ15〜20分かかる。3年分を一度に流さず、
# 1年ずつ3回に分けて実行すること（取得済みファイルはスキップされるので、
# 途中で失敗しても同じ範囲を再実行すれば続きから進む）。
#
#   1回目: start=2023-07-01  end=2024-06-30
#   2回目: start=2024-07-01  end=2025-06-30
#   3回目: start=2025-07-01  end=(今日)
#
# 月末の日付に注意（4/6/9/11月は30日まで、2月は28か29日まで）。
# 存在しない日付を入れると「期間を決める」ステップで止まる。

permissions:
  contents: read

on:
  schedule:
    # 毎日 JST 5:00（UTC 20:00）。前日の成績が確定している時間帯。
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "取得開始日 YYYY-MM-DD（省略時は前日）"
        required: false
      end:
        description: "取得終了日 YYYY-MM-DD"
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係のインストール
        run: pip install -r pipeline/requirements.txt

      - name: データベースを復元
        uses: actions/cache/restore@v4
        with:
          path: data/kyotei.db
          key: kyotei-db-
          restore-keys: kyotei-db-

      - name: 期間を決める
        id: range
        run: |
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"
          [ -z "$START" ] && START=$(date -u -d "yesterday +9 hours" +%F)
          [ -z "$END" ] && END=$START

          # 存在しない日付（2025-06-31 など）はここで弾く。
          # そのまま流すと download.py が分かりにくいエラーで落ちる。
          for D in "$START" "$END"; do
            if ! date -d "$D" +%F > /dev/null 2>&1; then
              echo "::error::日付 $D は存在しません。月末の日数を確認してください（4/6/9/11月は30日、2月は28か29日）"
              exit 1
            fi
          done

          echo "start=$START" >> $GITHUB_OUTPUT
          echo "end=$END" >> $GITHUB_OUTPUT
          echo "期間: $START 〜 $END"

      - name: 番組表・競走成績のダウンロード
        working-directory: pipeline
        run: python download.py --start ${{ steps.range.outputs.start }} --end ${{ steps.range.outputs.end }} --workers 8

      - name: データベースへ取り込み
        working-directory: pipeline
        run: python build_db.py --start ${{ steps.range.outputs.start }} --end ${{ steps.range.outputs.end }} --jobs 2

      - name: 取り込み結果の確認
        run: |
          python - <<'EOF'
          import sqlite3
          con = sqlite3.connect("data/kyotei.db")
          n, = con.execute("select count(*) from races where trifecta is not null").fetchone()
          lo, hi = con.execute("select min(date), max(date) from races").fetchone()
          print(f"結果確定レース: {n:,} 件 ({lo} 〜 {hi})")
          assert n > 0, "レースが1件も入っていません"
          EOF

      # 週次学習ワークフローも同じキャッシュを読む
      - name: データベースを保存
        uses: actions/cache/save@v4
        with:
          path: data/kyotei.db
          key: kyotei-db-${{ github.run_id }}
